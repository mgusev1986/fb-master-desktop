<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Перенаправление в Supabase — FB Master</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; }
  </style>
</head>
<body>
  <p id="msg">Открываем провайдер входа…</p>
  <p style="font-size:14px;color:#64748b"><a href="/auth/login">Отмена</a></p>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2.49.8";
    const url = {{ supabase_url | tojson }};
    const key = {{ supabase_anon_key | tojson }};
    const provider = {{ oauth_provider | tojson }};
    const redirectTo = {{ redirect_to | tojson }};
    const msg = document.getElementById("msg");
    const supabase = createClient(url, key, {
      auth: {
        flowType: "pkce",
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storage: window.localStorage,
      },
    });
    const { error } = await supabase.auth.signInWithOAuth({
      provider,
      options: { redirectTo, skipBrowserRedirect: false },
    });
    if (error) {
      msg.textContent = "Ошибка: " + (error.message || String(error));
    }
  </script>
</body>
</html>
