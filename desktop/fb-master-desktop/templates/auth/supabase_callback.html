<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Вход Supabase — FB Master</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; }
    #msg { line-height: 1.5; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <p id="msg">Завершение входа через Supabase…</p>
  <p id="sub" style="display:none;font-size:14px;color:#64748b"></p>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2.49.8";
    const url = {{ supabase_url | tojson }};
    const key = {{ supabase_anon_key | tojson }};
    const msg = document.getElementById("msg");
    const sub = document.getElementById("sub");
    sub.style.display = "block";
    const supabase = createClient(url, key, {
      auth: {
        flowType: "pkce",
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storage: window.localStorage,
      },
    });
    const { data, error } = await supabase.auth.exchangeCodeForSession(window.location.href);
    if (error) {
      msg.textContent =
        "Ошибка Supabase (обмен кода на сессию): " +
        (error.message || String(error)) +
        ". Проверьте в Supabase → URL Configuration, что в Redirect URLs есть именно этот адрес (и localhost, и 127.0.0.1, если заходите по-разному).";
      sub.innerHTML = '<a href="/auth/login">Вернуться ко входу</a>';
      return;
    }
    const token = data?.session?.access_token;
    if (!token) {
      msg.textContent = "Сессия не получена. Проверьте Redirect URLs в Supabase (Authentication → URL Configuration).";
      sub.innerHTML = '<a href="/auth/login">Вернуться ко входу</a>';
      return;
    }
    const r = await fetch("/auth/supabase/session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ access_token: token }),
      credentials: "include",
    });
    let payload = null;
    try { payload = await r.json(); } catch (_) {}
    if (r.ok && payload && payload.ok) {
      window.location.href = "/home";
      return;
    }
    const err = (payload && payload.error) ? payload.error : ("HTTP " + r.status);
    const hint =
      err === "access_denied"
        ? " Email не в списке ALLOWED_GOOGLE_EMAILS в .env / Настройках."
        : err === "supabase_token_invalid"
          ? " Токен не принят Supabase API — проверьте SUPABASE_URL и SUPABASE_ANON_KEY."
          : "";
    msg.textContent = "Не удалось создать сессию кабинета: " + err + hint;
    sub.innerHTML = '<a href="/auth/login">Вернуться ко входу</a>';
  </script>
</body>
</html>
