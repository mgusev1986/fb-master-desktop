    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap');
        
        :root {
            --gold: #f5d06e;
        }
        
        * {
            transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 250ms;
        }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        
        .heading {
            font-family: 'Playfair Display', sans-serif;
            letter-spacing: -0.04em;
        }
        
        .hero-bg {
            background: radial-gradient(circle at 30% 20%, #111111 0%, #0a0a0a 45%, #000000 100%);
        }
        
        .navbar {
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        
        .gold-gradient {
            background: linear-gradient(90deg, #f5d06e, #e8b93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .luxury-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(245, 208, 110, 0.2);
        }
        
        .luxury-card:hover {
            border-color: #f5d06e;
            box-shadow: 0 30px 60px -15px rgba(245, 208, 110, 0.3);
            transform: translateY(-8px);
        }
        
        .mockup-float {
            animation: luxury-float 6s ease-in-out infinite;
        }
        
        @keyframes luxury-float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(3deg); }
        }
        
        .testimonial-card {
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.4);
        }
        
        .cta-button {
            background: linear-gradient(90deg, #f5d06e, #e8b93d);
            color: #111;
            box-shadow: 0 15px 35px -10px #f5d06e;
        }
        
        .cta-button:hover {
            box-shadow: 0 25px 45px -10px #f5d06e;
            transform: scale(1.05);
        }

        #slidesTrack {
            will-change: transform;
        }

        .lang-btn {
            color: rgba(255,255,255,0.5);
        }
        .lang-btn.active {
            color: #f5d06e;
        }

        #promoChatLog::-webkit-scrollbar {
            width: 6px;
        }
        #promoChatLog::-webkit-scrollbar-thumb {
            background: rgba(245, 208, 110, 0.25);
            border-radius: 999px;
        }

        /* Лёгкое «подмигивание» FAB чата: редко, коротко, без навязчивости */
        @keyframes promo-chat-fab-soft {
            0%, 87%, 100% {
                transform: rotate(0deg) scale(1);
            }
            89% {
                transform: rotate(-5deg) scale(1.06);
            }
            91% {
                transform: rotate(5deg) scale(1.06);
            }
            93% {
                transform: rotate(-3deg) scale(1.03);
            }
            95% {
                transform: rotate(0deg) scale(1);
            }
        }

        @media (prefers-reduced-motion: no-preference) {
            .promo-chat-fab-bounce {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                transform-origin: center center;
                animation: promo-chat-fab-soft 3.5s ease-in-out infinite;
            }

            #promoChatFab:hover .promo-chat-fab-bounce,
            #promoChatFab[data-chat-open="1"] .promo-chat-fab-bounce {
                animation: none;
            }
        }
    </style>
</head>

    <script>
(function () {
    const LOCALE_BASE = '/static/locales/promo2';
    let slideInterval = null;
    let testimonialSection = null;
    let carouselEl = null;
    let trackEl = null;
    let dotsEl = null;
    let currentPage = 0;
    let itemsPerView = 3;
    let numPages = 1;
    let autoplayMs = 5200;

    function portraitUrl(seed) {
        return 'https://randomuser.me/api/portraits/' + seed;
    }

    const AVATARS = [
        'men/32.jpg', 'women/44.jpg', 'men/16.jpg', 'men/22.jpg', 'women/68.jpg',
        'men/55.jpg', 'women/21.jpg', 'men/63.jpg', 'women/54.jpg'
    ];

    function getItemsPerView() {
        if (window.innerWidth >= 1024) return 3;
        if (window.innerWidth >= 768) return 2;
        return 1;
    }

    function t(key) {
        return window.i18next.t(key);
    }

    window.__promoChatMsgs = window.__promoChatMsgs || [];

    /** Экранирование перед innerHTML (только для доверенного текста модели). */
    function promoChatEscHtml(s) {
        return String(s || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    /** Markdown-подобное оформление ответа ассистента: **жирный** → <strong>. */
    function promoAssistantRichHtml(raw) {
        var t = promoChatEscHtml(raw || '');
        t = t.replace(/\*\*([\s\S]*?)\*\*/g, function (_m, inner) {
            return '<strong class="font-semibold text-white">' + inner + '</strong>';
        });
        return t;
    }

    function renderPromoChatLog() {
        var log = document.getElementById('promoChatLog');
        if (!log || !window.__promoChatMsgs) return;
        log.innerHTML = '';
        window.__promoChatMsgs.forEach(function (m) {
            var row = document.createElement('div');
            row.className = 'flex ' + (m.role === 'user' ? 'justify-end' : 'justify-start');
            var inner = document.createElement('div');
            inner.className =
                'max-w-[92%] rounded-2xl px-3 py-2.5 border leading-relaxed whitespace-pre-wrap break-words ' +
                (m.role === 'user'
                    ? 'bg-[#f5d06e]/15 border-[#f5d06e]/35 text-white rounded-br-md'
                    : 'bg-white/[0.06] border-white/10 text-white/95 rounded-bl-md promo-chat-assistant');
            if (m.role === 'user') {
                inner.textContent = m.content || '';
            } else {
                inner.innerHTML = promoAssistantRichHtml(m.content || '');
            }
            row.appendChild(inner);
            log.appendChild(row);
        });
        log.scrollTop = log.scrollHeight;
    }

    function ensurePromoWelcome() {
        window.__promoChatMsgs = window.__promoChatMsgs || [];
        if (window.__promoChatMsgs.length === 0) {
            window.__promoChatMsgs.push({ role: 'assistant', content: t('chat.welcome') });
        }
        renderPromoChatLog();
    }

    function setPromoChatOpen(open) {
        var panel = document.getElementById('promoChatPanel');
        var root = document.getElementById('promoChatRoot');
        var fab = document.getElementById('promoChatFab');
        if (!panel) return;
        panel.classList.toggle('hidden', !open);
        if (fab) fab.setAttribute('data-chat-open', open ? '1' : '0');
        if (root) root.setAttribute('aria-hidden', open ? 'false' : 'true');
        if (open) {
            ensurePromoWelcome();
            setTimeout(function () {
                var inp = document.getElementById('promoChatInput');
                if (inp) inp.focus();
            }, 50);
        }
    }

    function refreshPromoChatI18n() {
        if (!window.i18next || !window.i18next.t) return;
        var title = document.getElementById('promoChatTitle');
        var sub = document.getElementById('promoChatSubtitle');
        var inp = document.getElementById('promoChatInput');
        var fab = document.getElementById('promoChatFab');
        if (title) title.textContent = t('chat.title');
        if (sub) sub.textContent = t('chat.status');
        if (inp) inp.setAttribute('placeholder', t('chat.placeholder'));
        if (fab) fab.setAttribute('aria-label', t('chat.fab_aria'));
        var cbtn = document.getElementById('promoChatClose');
        if (cbtn) cbtn.setAttribute('aria-label', t('chat.close_aria'));
        var sbtn = document.getElementById('promoChatSend');
        if (sbtn) sbtn.setAttribute('aria-label', t('chat.send_aria'));
        if (window.__promoChatMsgs && window.__promoChatMsgs.length === 1 && window.__promoChatMsgs[0].role === 'assistant') {
            window.__promoChatMsgs[0].content = t('chat.welcome');
            renderPromoChatLog();
        }
    }

    function initPromoSupportChat() {
        window.__promoChatMsgs = [];
        refreshPromoChatI18n();
        var fab = document.getElementById('promoChatFab');
        var closeB = document.getElementById('promoChatClose');
        var sendB = document.getElementById('promoChatSend');
        var inp = document.getElementById('promoChatInput');
        if (fab) {
            fab.addEventListener('click', function () {
                var panel = document.getElementById('promoChatPanel');
                var willOpen = !!(panel && panel.classList.contains('hidden'));
                setPromoChatOpen(willOpen);
            });
        }
        if (closeB) closeB.addEventListener('click', function () { setPromoChatOpen(false); });
        function doSend() {
            var sendBtn = document.getElementById('promoChatSend');
            var v = (inp && inp.value || '').trim();
            if (!v) return;
            window.__promoChatMsgs = window.__promoChatMsgs || [];
            window.__promoChatMsgs.push({ role: 'user', content: v });
            if (inp) inp.value = '';
            renderPromoChatLog();
            if (sendBtn) sendBtn.disabled = true;
            var loc = (window.i18next.language === 'en') ? 'en' : 'ru';
            fetch('/api/public/promo-chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ messages: window.__promoChatMsgs, locale: loc })
            })
                .then(function (r) {
                    return r.json().then(function (j) {
                        return { r: r, j: j };
                    }, function () {
                        return { r: r, j: {} };
                    });
                })
                .then(function (pair) {
                    var r = pair.r;
                    var data = pair.j;
                    if (!r.ok || !data.ok) {
                        if (window.__promoChatMsgs.length && window.__promoChatMsgs[window.__promoChatMsgs.length - 1].role === 'user') {
                            window.__promoChatMsgs.pop();
                        }
                        renderPromoChatLog();
                        var msg = (data && (data.detail || data.error)) ? String(data.detail || data.error) : '';
                        alert(msg || t('chat.error'));
                        return;
                    }
                    window.__promoChatMsgs.push({ role: 'assistant', content: String(data.reply || '') });
                    renderPromoChatLog();
                })
                .catch(function () {
                    if (window.__promoChatMsgs.length && window.__promoChatMsgs[window.__promoChatMsgs.length - 1].role === 'user') {
                        window.__promoChatMsgs.pop();
                    }
                    renderPromoChatLog();
                    alert(t('chat.error'));
                })
                .finally(function () {
                    if (sendBtn) sendBtn.disabled = false;
                });
        }
        if (sendB) sendB.addEventListener('click', doSend);
        if (inp) {
            inp.addEventListener('keydown', function (ev) {
                if (ev.key === 'Enter' && !ev.shiftKey) {
                    ev.preventDefault();
                    doSend();
                }
            });
        }
    }

    function applyDomI18n() {
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
            var key = el.getAttribute('data-i18n');
            if (!key) return;
            var val = window.i18next.t(key);
            if (val && val !== key) el.textContent = val;
        });
        document.title = window.i18next.t('meta.title');
        var md = document.querySelector('meta[name="description"]');
        if (md) md.setAttribute('content', window.i18next.t('meta.description'));
        document.documentElement.lang = window.i18next.language === 'en' ? 'en' : 'ru';
        refreshPromoChatI18n();
    }

    function updateLangButtons() {
        var lng = window.i18next.language || 'ru';
        document.querySelectorAll('.lang-btn').forEach(function (btn) {
            var l = btn.getAttribute('data-set-lang');
            btn.classList.toggle('active', l === lng);
        });
    }

    function esc(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }

    function cardHtml(item, idx) {
        var img = portraitUrl(AVATARS[idx % AVATARS.length]);
        var quote = esc(item.quote);
        var name = esc(item.name);
        var role = esc(item.role);
        var metric = esc(item.metric);
        return (
            '<div class="testimonial-slide flex-shrink-0 px-2 md:px-3" style="box-sizing:border-box">' +
            '<div class="luxury-card bg-[#111]/80 rounded-[2rem] p-8 md:p-10 h-full flex flex-col justify-between testimonial-card">' +
            '<p class="text-lg md:text-xl italic font-light text-white/90 leading-relaxed mb-8 md:mb-10">&#8220;' + quote + '&#8221;</p>' +
            '<div class="flex items-center gap-x-4 pt-5 border-t border-white/10">' +
            '<img src="' + esc(img) + '" alt="" class="w-12 h-12 md:w-14 md:h-14 rounded-full border border-white/20 object-cover grayscale-[20%]" width="56" height="56" loading="lazy">' +
            '<div class="min-w-0">' +
            '<div class="font-semibold text-base md:text-lg">' + name + '</div>' +
            '<div class="text-white/50 text-xs md:text-sm truncate">' + role + '</div>' +
            '<div class="text-[#f5d06e] font-medium text-xs md:text-sm mt-0.5"><i class="fa-solid fa-arrow-trend-up mr-1 text-[10px]"></i>' + metric + '</div>' +
            '</div></div></div></div>'
        );
    }

    function layoutCarousel() {
        if (!carouselEl || !trackEl) return;
        itemsPerView = getItemsPerView();
        var slides = trackEl.querySelectorAll('.testimonial-slide');
        var n = slides.length;
        if (n === 0) return;
        var cw = carouselEl.clientWidth;
        var cardW = cw / itemsPerView;
        numPages = Math.max(1, Math.ceil(n / itemsPerView));
        if (currentPage >= numPages) currentPage = numPages - 1;
        slides.forEach(function (s) {
            s.style.flex = '0 0 ' + cardW + 'px';
            s.style.width = cardW + 'px';
            s.style.maxWidth = cardW + 'px';
        });
        trackEl.style.width = (cardW * n) + 'px';
        goToPage(currentPage, false);
        renderDots();
    }

    function goToPage(page, animate) {
        if (!carouselEl || !trackEl) return;
        itemsPerView = getItemsPerView();
        var slides = trackEl.querySelectorAll('.testimonial-slide');
        var n = slides.length;
        numPages = Math.max(1, Math.ceil(n / itemsPerView));
        currentPage = ((page % numPages) + numPages) % numPages;
        var cw = carouselEl.clientWidth;
        var offset = currentPage * cw;
        trackEl.style.transition = animate ? 'transform 700ms cubic-bezier(0.4, 0, 0.2, 1)' : 'none';
        trackEl.style.transform = 'translateX(-' + offset + 'px)';
        if (dotsEl) {
            Array.from(dotsEl.children).forEach(function (dot, i) {
                dot.className = 'h-2 rounded-full transition-colors ' + (i === currentPage ? 'bg-[#f5d06e] w-10 md:w-12' : 'bg-white/20 hover:bg-white/40 w-8 md:w-10');
            });
        }
    }

    function renderDots() {
        if (!dotsEl) return;
        dotsEl.innerHTML = '';
        for (var i = 0; i < numPages; i++) {
            (function (idx) {
                var dot = document.createElement('button');
                dot.type = 'button';
                dot.className = 'h-2 rounded-full transition-colors bg-white/20 hover:bg-white/40 w-8 md:w-10';
                dot.setAttribute('aria-label', 'Page ' + (idx + 1));
                dot.addEventListener('click', function () { goToPage(idx, true); });
                dotsEl.appendChild(dot);
            })(i);
        }
        goToPage(currentPage, false);
    }

    function rebuildTestimonials() {
        if (!trackEl) return;
        var items = window.i18next.t('testimonials.items', { returnObjects: true });
        if (!Array.isArray(items)) return;
        trackEl.innerHTML = items.map(function (it, i) { return cardHtml(it, i); }).join('');
        currentPage = 0;
        layoutCarousel();
    }

    function startAutoplay() {
        stopAutoplay();
        slideInterval = setInterval(function () {
            goToPage(currentPage + 1, true);
        }, autoplayMs);
    }

    function stopAutoplay() {
        if (slideInterval) {
            clearInterval(slideInterval);
            slideInterval = null;
        }
    }

    function jitterAutoplayMs() {
        autoplayMs = 4000 + Math.floor(Math.random() * 2001);
    }

    window.__promoCarouselNext = function () {
        goToPage(currentPage + 1, true);
        jitterAutoplayMs();
        stopAutoplay();
        startAutoplay();
    };
    window.__promoCarouselPrev = function () {
        goToPage(currentPage - 1, true);
        jitterAutoplayMs();
        stopAutoplay();
        startAutoplay();
    };

    function bindHoverPause() {
        testimonialSection = document.getElementById('testimonials');
        if (!testimonialSection) return;
        testimonialSection.addEventListener('mouseenter', stopAutoplay);
        testimonialSection.addEventListener('mouseleave', startAutoplay);
        testimonialSection.addEventListener('touchstart', stopAutoplay, { passive: true });
        testimonialSection.addEventListener('touchend', function () {
            setTimeout(startAutoplay, 2000);
        }, { passive: true });
    }

    function bindLangSwitch() {
        document.querySelectorAll('[data-set-lang]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var lng = btn.getAttribute('data-set-lang');
                if (!lng) return;
                window.i18next.changeLanguage(lng, function () {
                    try { localStorage.setItem('promo2_lang', lng); } catch (e) {}
                    applyDomI18n();
                    rebuildTestimonials();
                    updateLangButtons();
                });
            });
        });
    }

    window.toggleMenu = function () {
        var menu = document.getElementById('mobileMenu');
        if (menu) menu.classList.toggle('hidden');
    };

    Promise.all([
        fetch(LOCALE_BASE + '/ru.json').then(function (r) { return r.json(); }),
        fetch(LOCALE_BASE + '/en.json').then(function (r) { return r.json(); })
    ]).then(function (bundles) {
        var stored = 'ru';
        try { stored = localStorage.getItem('promo2_lang') || 'ru'; } catch (e) {}
        if (stored !== 'en' && stored !== 'ru') stored = 'ru';

        window.i18next.init({
            lng: stored,
            fallbackLng: 'ru',
            resources: {
                ru: { translation: bundles[0] },
                en: { translation: bundles[1] }
            }
        }, function () {
            carouselEl = document.getElementById('testimonialCarousel');
            trackEl = document.getElementById('slidesTrack');
            dotsEl = document.getElementById('dotsContainer');
            applyDomI18n();
            updateLangButtons();
            rebuildTestimonials();
            bindLangSwitch();
            bindHoverPause();
            jitterAutoplayMs();
            startAutoplay();
            initPromoSupportChat();
            window.addEventListener('resize', function () {
                layoutCarousel();
            });
        });
    }).catch(function () {
        document.body.insertAdjacentHTML('afterbegin', '<div style="padding:12px;background:#7f1d1d;color:#fff;text-align:center">Не удалось загрузить переводы. Проверьте путь /static/locales/promo2/</div>');
    });
})();
    </script>
</body>
</html>
