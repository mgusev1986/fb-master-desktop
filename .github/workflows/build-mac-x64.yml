name: Build Mac x64 (Intel) SOCMASTER

on:
  # Запуск вручную из вкладки Actions с указанием версии
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия сборки (например 3.0.5)'
        required: true
        default: '3.0.5'
  # Автозапуск на git tag v*
  push:
    tags:
      - 'v*'

# contents: write нужен softprops/action-gh-release для создания/обновления GitHub Release
# (fallback, когда квота Actions artifacts исчерпана).
permissions:
  contents: write

jobs:
  build-mac-x64:
    # 3.0.5+ (28 апр 2026): macos-13 (Ventura) deprecated GitHub'ом 22 сен 2025 и
    # fully unsupported с 4 дек 2025 — наши job'ы там зависают в queue до 24h-timeout.
    # Решение: macos-14 (arm64-runner) + cross-arch x64 через Rosetta 2.
    #   - actions/setup-node + setup-python с architecture: x64 → x86_64-бинарники
    #   - FBM_TARGET_ARCH=x86_64 → ensure-macos-embedded-python.sh качает x86_64 CPython
    #   - x86_64 Python запускается под Rosetta → platform.machine()=x86_64 →
    #     playwright скачивает x64 Chromium
    #   - electron-builder --x64 → собирает x86_64 DMG
    #   - MACOSX_DEPLOYMENT_TARGET=12.0 → совместимость с macOS Monterey 12.7.6
    #     (например клиенты на MacBook Air 2017)
    runs-on: macos-14
    timeout-minutes: 60
    env:
      # Кросс-сборка x86_64 на arm64-runner.
      FBM_TARGET_ARCH: x86_64
      # Минимальная версия macOS у клиента — Catalina 10.15 (с 06.05.2026: клиент на
      # macOS 10.15.7 Intel Mac не мог запустить prod 3.0.91, который требовал 11.0+).
      # python-build-standalone cpython-3.12.8 x86_64-apple-darwin tarball поддерживает 10.15+.
      MACOSX_DEPLOYMENT_TARGET: '10.15'
    steps:
      # 3.0.6+: код живёт в private repo socmaster-core. Клонируем его сюда вместо
      # actions/checkout@v4 (которая бы клонировала public socmaster-builder).
      # Это позволяет держать public-репо минимальным (только workflows + README),
      # а весь код прятать в приватном repo с защитой через PAT секрет.
      - name: Clone private socmaster-core repo
        shell: bash
        env:
          PAT: ${{ secrets.CORE_REPO_PAT }}
        run: |
          cd "$GITHUB_WORKSPACE"
          # 3.0.7+: явно клонируем рабочую ветку с fix'ами (на main политика
          # запрещает прямой push без PR review, поэтому fix лежит на feature-branch).
          git clone --depth 1 --branch migration/private-submodule "https://x-access-token:${PAT}@github.com/socmaster2-team/socmaster-core.git" "$RUNNER_TEMP/code"
          cp -R "$RUNNER_TEMP/code/." ./
          rm -rf "$RUNNER_TEMP/code"
          # Если пуш был на тег — пытаемся checkout того же тега в private (если он там есть)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            git fetch --tags --depth=1 origin 2>/dev/null || true
            git checkout "$TAG" 2>/dev/null && echo "✅ Checked out tag $TAG in private repo" || echo "⚠️ Tag $TAG not in private, using main"
          fi
          echo "─── Workspace contents ───"
          ls -la | head -20

      - name: Show host runner architecture (для отладки)
        run: |
          echo "host uname -m: $(uname -m)"
          echo "host uname -a: $(uname -a)"
          echo "FBM_TARGET_ARCH=$FBM_TARGET_ARCH"
          echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
          # Проверяем что Rosetta 2 доступна (нужна для запуска x86_64 binaries на arm64).
          if [[ "$(uname -m)" == "arm64" ]]; then
            arch -x86_64 /usr/bin/true && echo "✅ Rosetta 2 OK" || (echo "❌ Rosetta 2 не установлена" && exit 1)
          fi

      - name: Setup Node.js 20 (x64 — для arm64-runner качается x86_64 node, запустится через Rosetta)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          architecture: 'x64'

      # actions/setup-python@v5 на macos-14 кладёт arm64 binary в каталог "x64"
      # (известная проблема: architecture: x64 не даёт настоящий x86_64 Python).
      # Нам он и не нужен — embedded Python для bundle качается через
      # ensure-macos-embedded-python.sh с FBM_TARGET_ARCH=x86_64.
      # Системный /usr/bin/python3 хватит для тривиальных скриптов CI (jq-style).

      - name: Verify cross-arch x64 environment (только node — единственное что нужно для билда)
        run: |
          echo "node: $(which node) — $(node -p 'process.arch')"
          echo "system python3: $(which python3) — $(python3 -c 'import platform; print(platform.machine())')"
          if [[ "$(node -p 'process.arch')" != "x64" ]]; then
            echo "❌ ОШИБКА: node не x64 (process.arch=$(node -p 'process.arch'))" && exit 1
          fi
          echo "✅ Node.js x64 готов (Python для bundle качает prepare-bundle сам через FBM_TARGET_ARCH)"

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "v=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "v=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "v=0.0.0-dev" >> $GITHUB_OUTPUT
          fi
          cat $GITHUB_OUTPUT

      - name: Set package.json version
        shell: bash
        run: |
          v="${{ steps.ver.outputs.v }}"
          python3 -c "
          import json
          p = 'desktop/fb-master-desktop/package.json'
          with open(p) as f: d = json.load(f)
          d['version'] = '$v'
          with open(p, 'w') as f: json.dump(d, f, indent=2, ensure_ascii=False)
          print('package.json version →', '$v')
          "

      - name: Prepare backend bundle (x86_64 cross-arch)
        shell: bash
        run: |
          # FBM_TARGET_ARCH=x86_64 (env workflow) → ensure-macos-embedded-python.sh
          # принудительно качает x86_64 CPython, который при запуске на arm64-host
          # пойдёт через Rosetta 2 (platform.machine()=x86_64).
          # 3.0.7+: ensure-macos-embedded-python.sh теперь оборачивает playwright
          # install в `arch -x86_64`, чтобы Node-driver тоже шёл через Rosetta
          # и качал именно x86_64 Chromium (а не arm64, как было в 3.0.6).
          chmod +x scripts/prepare-desktop-backend-bundle.sh
          bash scripts/prepare-desktop-backend-bundle.sh
          # Verify архитектура embedded Python — если не x86_64, билд падает.
          file desktop/fb-master-desktop/resources-fb-master-backend/python/bin/python3.12 | grep -q "x86_64" || (echo "ОШИБКА: embedded Python не x86_64!" && exit 1)
          echo "✅ Embedded Python x86_64 готов"
          # 3.0.7+ NEW: Verify архитектура bundled Chromium. В 3.0.6 этой проверки
          # не было, и в x64-DMG ушёл arm64 Chromium → клиент на Intel Mac
          # получил errno -86 (EBADARCH) при spawn'е Chromium.
          CHROMIUM_BIN=$(find desktop/fb-master-desktop/resources-fb-master-backend/playwright-browsers -type f -path '*/MacOS/Chromium' | head -1)
          if [[ -z "$CHROMIUM_BIN" ]]; then
            echo "ОШИБКА: bundled Chromium не найден!" && exit 1
          fi
          file "$CHROMIUM_BIN"
          file "$CHROMIUM_BIN" | grep -q "x86_64" || (echo "ОШИБКА: bundled Chromium не x86_64 — баг 3.0.6 повторился!" && exit 1)
          echo "✅ Bundled Chromium x86_64 готов"

      - name: Install Electron dependencies (x64 npm via Rosetta)
        shell: bash
        working-directory: desktop/fb-master-desktop
        run: |
          npm ci --no-audit --no-fund

      - name: Build Mac x64 DMG
        shell: bash
        working-directory: desktop/fb-master-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SKIP_NOTARIZE: '1'
        run: |
          # electron-builder --x64 → собирает x86_64 DMG из x86_64 Electron + наш bundle.
          # Несмотря на arm64-runner, output DMG будет полностью x86_64 (electron-builder
          # качает pre-built Electron x64 из npm).
          npm run dist:mac:x64

      - name: Verify built DMG architecture
        shell: bash
        run: |
          DIST="desktop/fb-master-desktop/dist"
          DMG="$DIST/SOCMASTER-${{ steps.ver.outputs.v }}-mac-x64.dmg"
          if [[ ! -f "$DMG" ]]; then
            echo "❌ DMG не найден: $DMG" && ls -la "$DIST" && exit 1
          fi
          # Распакуем .app из DMG и проверим архитектуру главного бинарника.
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -readonly
          APP=$(find "$MNT" -name "*.app" -maxdepth 2 -type d | head -1)
          BIN="$APP/Contents/MacOS/SOCMASTER"
          if [[ -f "$BIN" ]]; then
            file "$BIN" | tee /tmp/app-arch.txt
            grep -q "x86_64" /tmp/app-arch.txt || (echo "❌ ОШИБКА: .app не x86_64!" && hdiutil detach "$MNT" && exit 1)
            echo "✅ .app x86_64 подтверждён"
          fi
          hdiutil detach "$MNT"

      - name: Collect artifacts
        shell: bash
        run: |
          DIST="desktop/fb-master-desktop/dist"
          ls -la "$DIST"
          mkdir -p artifacts-mac-x64
          # Берём только x64 файлы (после dist:mac:x64 там должен быть только x64)
          cp "$DIST"/SOCMASTER-*-mac-x64.dmg artifacts-mac-x64/ 2>/dev/null || true
          cp "$DIST"/SOCMASTER-*-mac-x64.dmg.blockmap artifacts-mac-x64/ 2>/dev/null || true
          ls -lh artifacts-mac-x64/

      - name: Upload Mac x64 artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true  # storage quota — не валим job; DMG всё равно уйдёт в GH Release ниже
        with:
          name: SOCMASTER-${{ steps.ver.outputs.v }}-mac-x64
          path: artifacts-mac-x64/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish Mac x64 DMG to GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: SOCMASTER ${{ steps.ver.outputs.v }}
          files: |
            artifacts-mac-x64/*.dmg
            artifacts-mac-x64/*.dmg.blockmap
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
