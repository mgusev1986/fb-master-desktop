name: Build Windows SOCMASTER

on:
  # Запуск вручную из вкладки Actions с указанием версии
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия сборки (например 2.28.0)'
        required: true
        default: '2.28.0'
  # Автозапуск на git tag v*
  push:
    tags:
      - 'v*'

# contents: write нужен softprops/action-gh-release для создания/обновления GitHub Release
# (fallback, когда квота Actions artifacts исчерпана).
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # 3.0.6+: код живёт в private repo socmaster-core. Клонируем его сюда вместо
      # actions/checkout@v4 (которая бы клонировала public socmaster-builder).
      - name: Clone private socmaster-core repo
        shell: bash
        env:
          PAT: ${{ secrets.CORE_REPO_PAT }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 "https://x-access-token:${PAT}@github.com/mgusev1986/socmaster-core.git" "$RUNNER_TEMP/code"
          cp -R "$RUNNER_TEMP/code/." ./
          rm -rf "$RUNNER_TEMP/code"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            git fetch --tags --depth=1 origin 2>/dev/null || true
            git checkout "$TAG" 2>/dev/null && echo "Checked out tag $TAG in private repo" || echo "Tag $TAG not in private, using main"
          fi
          ls -la | head -20

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.12 (для pip запуска на CI — embedded Python качает ps1)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "v=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "v=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "v=0.0.0-dev" >> $GITHUB_OUTPUT
          fi
          echo "Building version ${{ steps.ver.outputs.v }}"

      - name: Set package.json version
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.v }}"
          $pkg = Get-Content "desktop\fb-master-desktop\package.json" -Raw | ConvertFrom-Json
          $pkg.version = $v
          $pkg | ConvertTo-Json -Depth 99 | Set-Content "desktop\fb-master-desktop\package.json" -Encoding utf8
          Write-Host "package.json version → $v"

      - name: Prepare backend bundle (Windows)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\prepare-desktop-backend-bundle-win.ps1

      - name: Install Electron dependencies
        shell: pwsh
        working-directory: "desktop/fb-master-desktop"
        run: |
          npm ci --no-audit --no-fund

      - name: Build Windows installer (NSIS .exe)
        shell: pwsh
        working-directory: "desktop/fb-master-desktop"
        env:
          # На CI нет Apple-сертификатов → выключаем любые попытки подписать Mac-артефакты
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SKIP_NOTARIZE: '1'
        run: |
          npm run dist:win

      - name: Collect artifacts
        shell: pwsh
        run: |
          $dist = "desktop\fb-master-desktop\dist"
          Get-ChildItem $dist | Format-Table -AutoSize
          New-Item -ItemType Directory -Force -Path "artifacts-win" | Out-Null
          # Копируем .exe и blockmap (убираем latest.yml с приватными данными при желании)
          Copy-Item "$dist\*.exe" "artifacts-win\" -ErrorAction SilentlyContinue
          Copy-Item "$dist\*.exe.blockmap" "artifacts-win\" -ErrorAction SilentlyContinue
          Get-ChildItem "artifacts-win"

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true  # storage quota — не валим job; .exe всё равно уйдёт в GH Release ниже
        with:
          name: SOCMASTER-${{ steps.ver.outputs.v }}-win
          path: "artifacts-win/*"
          if-no-files-found: error
          retention-days: 30

      - name: Publish .exe to GitHub Release (fallback when artifact storage full)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: SOCMASTER ${{ steps.ver.outputs.v }}
          files: |
            artifacts-win/*.exe
            artifacts-win/*.exe.blockmap
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
